<!DOCTYPE html>
<html xml:lang="es">
  <head>
    <title>Sumador</title>
  </head>
  <body>
    <h1>Sumador</h1>
    <form id="sumar-form">
      <label for="primer-numero">Primer número:</label>
      <input type="number" id="primer-numero" />
      <label for="segundo-numero">Segundo número:</label>
      <input type="number" id="segundo-numero" />
      <input type="submit" value="Sumar" id="sumar-button" />
    </form>
    <div id="resultado-div"></div>

    <h1>Multiplicador</h1>
    <form id="multiplicar-form">
      <label for="primer-numero-multiplicar">Primer número:</label>
      <input type="number" id="primer-numero-multiplicar" />
      <label for="segundo-numero-multiplicar">Segundo número:</label>
      <input type="number" id="segundo-numero-multiplicar" />
      <input type="submit" value="Multiplicar" id="multiplicar-button" /> 
      </form>
    <div id="resultado-multiplicar-div"></div>
    <h2>Saludador</h2>
      <form id="saludar-form">
      <label for="nombre-input">Nombre:</label>
      <input type="text" id="nombre-input" placeholder="Escribe tu nombre" />

      <label for="genero-select">Género:</label>
        <select id="genero-select">>
         <option value="masculino">Masculino</option>
         <option value="femenino">Femenino</option>
        </select>
  
       <label for="idioma-select">Género:</label>
        <select id="idioma-select">>
         <option value="espaniol">Espaniol</option>
         <option value="ingles">Ingles</option>
        </select>

      <label for="edad-input">Edad:</label>
       <input type="number" id="edad-input" placeholder="Tu edad" />

      <input type="submit" value="saludo" id="saludar-button" />
      </form>
      <div id="resultado-saludo-div"></div>

    <script type="module" src="./src/presenter.js"></script>
  </body>
</html>
